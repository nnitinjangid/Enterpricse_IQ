services:

  # =========================================================
  # MySQL
  # =========================================================

  mysql:
    image: mysql:8.0

    container_name: enterpriseiq-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: enterpriseiq

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================================================
  # Qdrant
  # =========================================================

  qdrant:
    image: qdrant/qdrant:latest

    container_name: enterpriseiq-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage


  # =========================================================
  # EnterpriseIQ Backend
  # =========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: enterpriseiq-backend

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

      qdrant:
        condition: service_started

    environment:

      # -----------------------------------------------------
      # Application
      # -----------------------------------------------------

      APP_NAME: EnterpriseIQ
      APP_ENV: production
      DEBUG: "False"

      # -----------------------------------------------------
      # MySQL
      # -----------------------------------------------------

      DATABASE_URL: mysql+mysqlconnector://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/enterpriseiq

      # -----------------------------------------------------
      # Authentication
      # -----------------------------------------------------

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      # -----------------------------------------------------
      # Qdrant
      # -----------------------------------------------------

      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: enterpriseiq_documents

      # -----------------------------------------------------
      # Embeddings
      # -----------------------------------------------------

      EMBEDDING_MODEL: all-MiniLM-L6-v2

      # -----------------------------------------------------
      # Groq
      # -----------------------------------------------------

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}

    ports:
      - "8000:8000"

    volumes:
      - ./backend/uploads:/app/uploads


# ===========================================================
# Persistent Volumes
# ===========================================================

volumes:

  mysql_data:

  qdrant_data: