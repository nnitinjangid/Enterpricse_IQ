services:

  # ==========================================
  # MySQL Database
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: enterpriseiq-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: enterpriseiq_root
      MYSQL_DATABASE: enterpriseiq

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-penterpriseiq_root"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ==========================================
  # Qdrant Vector Database
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterpriseiq-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage


  # ==========================================
  # EnterpriseIQ FastAPI Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: enterpriseiq-backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      # Docker service names are used instead of localhost
      DATABASE_URL: mysql+mysqlconnector://root:enterpriseiq_root@mysql:3306/enterpriseiq

      QDRANT_URL: http://qdrant:6333

      QDRANT_COLLECTION: enterpriseiq_documents

      EMBEDDING_MODEL: all-MiniLM-L6-v2

    volumes:
      - ./backend/uploads:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy

      qdrant:
        condition: service_started


# ==========================================
# Persistent Volumes
# ==========================================
volumes:

  mysql_data:

  qdrant_data: